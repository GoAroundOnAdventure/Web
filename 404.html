<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoAround | Redirecting...</title>
    <script type="text/javascript">
        // Extract the EMRGNCY ID from path, query params, or hash
        var path = window.location.pathname;
        var search = window.location.search;
        var hash = window.location.hash;

        // Look for the EMRGNCY alphanumeric pattern (including # and _)
        var idMatch = path.match(/EMRGNCY[A-Za-z0-9#_]+/);
        if (!idMatch && search) {
            idMatch = search.match(/EMRGNCY[A-Za-z0-9#_]+/);
        }
        if (!idMatch && hash) {
            idMatch = hash.match(/EMRGNCY[A-Za-z0-9#_]+/);
        }

        if (idMatch) {
            var emergencyId = idMatch[0];
            // Redirect to the concrete static index.html with the id parameter
            // preserves any hash fragments (e.g. #User_0101)
            var redirectUrl = '/e/index.html?id=' + emergencyId + (hash ? hash : '');
            window.location.replace(redirectUrl);
        } else {
            // Default fallback if no emergency ID is found
            window.location.replace('https://www.goaroundonadventure.com/');
        }
    </script>
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f5f5f7; margin: 0;">
    <div style="text-align: center; color: #1d1d1f;">
        <p style="font-size: 16px; font-weight: 600;">Redirecting to GoAround Medical ID...</p>
    </div>
</body>
</html>
